name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift tests
        run: swift test

  build-cli:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build CLI
        run: swift build -c release
